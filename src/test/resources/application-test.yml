spring:
  sql:
    init:
      mode: never

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: false

  thymeleaf:
    cache: false

logging:
  level:
    root: WARN
    com.jairomatias.eventix: INFO
    org.flywaydb: DEBUG
