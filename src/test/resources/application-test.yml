spring:
  datasource:
    url: jdbc:h2:mem:eventix;MODE=MSSQLServer;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver

  sql:
    init:
      mode: never

  jpa:
    open-in-view: false

    defer-datasource-initialization: true

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: false

  thymeleaf:
    cache: false

logging:
  level:
    root: WARN
    com.jairomatias.eventix: INFO
    org.flywaydb: DEBUG