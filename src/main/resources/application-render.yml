spring:
  datasource:
    url: jdbc:h2:mem:eventix;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  thymeleaf:
    cache: true

server:
  port: ${PORT:10000}
  forward-headers-strategy: framework

management:
  health:
    mail:
      enabled: false

app:
  base-url: ${RENDER_EXTERNAL_URL:https://eventix.onrender.com}

eventix:
  security:
    allow-default-bootstrap-administrator: false
  notifications:
    email:
      enabled: false
    reminders:
      enabled: false
  ticketing:
    allow-ephemeral-signing-key: true
