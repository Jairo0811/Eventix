spring:
  application:
    name: eventix
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/eventix?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santo_Domingo}
    username: ${DB_USERNAME:eventix}
    password: ${DB_PASSWORD:eventix}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Santo_Domingo
  flyway:
    enabled: true
    locations: classpath:db/migration
  messages:
    basename: messages
    encoding: UTF-8
  thymeleaf:
    cache: false

server:
  port: ${APP_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  timezone: America/Santo_Domingo
  currency: DOP

