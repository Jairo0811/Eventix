spring:
  application:
    name: eventix

  profiles:
    default: dev

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=EventixDb;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:eventix_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1800000

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

        jdbc:
          time_zone: America/Santo_Domingo

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_READ_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:5000}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:false}

  messages:
    basename: messages
    encoding: UTF-8

  thymeleaf:
    cache: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${APP_PORT:8080}
  shutdown: graceful

  error:
    include-message: never
    include-stacktrace: never

    whitelabel:
      enabled: false

  servlet:
    session:
      timeout: 30m

      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

info:
  app:
    name: Eventix
    version: "@project.version@"
    description: Plataforma profesional de gestión de eventos y ticketing digital.

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

  timezone: America/Santo_Domingo

  currency: DOP

  event-cover:
    storage-path: ${EVENT_COVER_STORAGE_PATH:data/event-covers}

eventix:
  eligibility:
    hmac-secret: ${EVENTIX_ELIGIBILITY_HMAC_SECRET:}

  security:
    allow-default-bootstrap-administrator: ${EVENTIX_ALLOW_DEFAULT_BOOTSTRAP_ADMIN:true}
    bootstrap-administrator-password: ${EVENTIX_BOOTSTRAP_ADMIN_PASSWORD:}
    rate-limit:
      enabled: ${EVENTIX_RATE_LIMIT_ENABLED:true}
      login-requests-per-minute: ${EVENTIX_LOGIN_RATE_LIMIT:10}
      wallet-requests-per-minute: ${EVENTIX_WALLET_RATE_LIMIT:120}
      mutation-requests-per-minute: ${EVENTIX_MUTATION_RATE_LIMIT:180}
      maximum-tracked-clients: ${EVENTIX_RATE_LIMIT_MAX_CLIENTS:10000}

  notifications:
    email:
      enabled: ${EVENTIX_EMAIL_ENABLED:false}
      from: ${EVENTIX_EMAIL_FROM:no-reply@eventix.local}
    reminders:
      enabled: ${EVENTIX_REMINDERS_ENABLED:false}
      advance: ${EVENTIX_REMINDER_ADVANCE:PT24H}
      scan-interval: ${EVENTIX_REMINDER_SCAN_INTERVAL:PT5M}
      retry-delay: ${EVENTIX_REMINDER_RETRY_DELAY:PT15M}
      maximum-attempts: ${EVENTIX_REMINDER_MAX_ATTEMPTS:5}
      candidate-batch-size: ${EVENTIX_REMINDER_CANDIDATE_BATCH_SIZE:500}
      delivery-batch-size: ${EVENTIX_REMINDER_DELIVERY_BATCH_SIZE:100}

  maps:
    google:
      embed-api-key: ${GOOGLE_MAPS_EMBED_API_KEY:}

  reservations:
    hold-duration: ${RESERVATION_HOLD_DURATION:PT15M}
    expiration-scan-interval: ${RESERVATION_EXPIRATION_SCAN_INTERVAL:PT1M}

  payments:
    azul-wallet:
      enabled: ${AZUL_WALLET_ENABLED:false}
      environment: ${AZUL_WALLET_ENVIRONMENT:TEST}
      store: ${AZUL_STORE:}
      auth1: ${AZUL_AUTH1:}
      auth2: ${AZUL_AUTH2:}
      channel: ${AZUL_CHANNEL:EC}
      merchant-display-name: ${AZUL_MERCHANT_DISPLAY_NAME:Eventix}
      initiative-context: ${AZUL_APPLE_INITIATIVE_CONTEXT:}
      google-merchant-id: ${AZUL_GOOGLE_MERCHANT_ID:}
      apple-domain-association: ${AZUL_APPLE_DOMAIN_ASSOCIATION:}

  ticketing:
    issuer-name: ${TICKETING_ISSUER_NAME:Eventix}
    signing-key-id: ${TICKETING_SIGNING_KEY_ID:eventix-dev}
    signing-private-key: ${TICKETING_SIGNING_PRIVATE_KEY:}
    signing-public-key: ${TICKETING_SIGNING_PUBLIC_KEY:}
    verification-public-keys: ${TICKETING_VERIFICATION_PUBLIC_KEYS:}
    allow-ephemeral-signing-key: ${TICKETING_ALLOW_EPHEMERAL_SIGNING_KEY:true}
    allow-reentry: ${TICKETING_ALLOW_REENTRY:false}
    expiration-scan-interval: ${TICKETING_EXPIRATION_SCAN_INTERVAL:PT5M}

    google-wallet:
      enabled: ${GOOGLE_WALLET_ENABLED:false}
      issuer-id: ${GOOGLE_WALLET_ISSUER_ID:}
      service-account-json: ${GOOGLE_WALLET_SERVICE_ACCOUNT_JSON:}
      origins: ${GOOGLE_WALLET_ORIGINS:http://localhost:8080}

    apple-wallet:
      enabled: ${APPLE_WALLET_ENABLED:false}
      pass-type-identifier: ${APPLE_WALLET_PASS_TYPE_IDENTIFIER:}
      team-identifier: ${APPLE_WALLET_TEAM_IDENTIFIER:}
      certificate-p12: ${APPLE_WALLET_CERTIFICATE_P12:}
      certificate-password: ${APPLE_WALLET_CERTIFICATE_PASSWORD:}
      wwdr-certificate: ${APPLE_WALLET_WWDR_CERTIFICATE:}
      web-service-url: ${APPLE_WALLET_WEB_SERVICE_URL:${app.base-url}/api/wallet/apple/v1}
      apns-enabled: ${APPLE_WALLET_APNS_ENABLED:false}
      apns-production: ${APPLE_WALLET_APNS_PRODUCTION:false}
