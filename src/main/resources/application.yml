spring:
  application:
    name: eventix

  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=EventixDb;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:eventix_app}
    password: ${DB_PASSWORD:Eventix2026*}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1800000

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true

        jdbc:
          time_zone: America/Santo_Domingo

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  messages:
    basename: messages
    encoding: UTF-8

  thymeleaf:
    cache: false

server:
  port: ${APP_PORT:8080}

  error:
    include-message: never
    include-stacktrace: never

    whitelabel:
      enabled: false

  servlet:
    session:
      timeout: 30m

      cookie:
        http-only: true
        same-site: lax

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

  timezone: America/Santo_Domingo

  currency: DOP