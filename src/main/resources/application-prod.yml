spring:
  thymeleaf:
    cache: true
  flyway:
    url: ${FLYWAY_DB_URL:${DB_URL}}
    user: ${FLYWAY_DB_USERNAME}
    password: ${FLYWAY_DB_PASSWORD}

server:
  # native: Tomcat resuelve la IP real (X-Forwarded-For) solo si el peer es un proxy
  # interno (por defecto rangos privados). Ajusta SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES
  # si tu proxy usa otra red. Para volver al comportamiento anterior:
  # SERVER_FORWARD_HEADERS_STRATEGY=framework
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:native}
  servlet:
    session:
      cookie:
        secure: true

logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
    com.jairomatias.eventix: INFO

eventix:
  security:
    allow-default-bootstrap-administrator: false
  ticketing:
    allow-ephemeral-signing-key: ${TICKETING_ALLOW_EPHEMERAL_SIGNING_KEY:false}
