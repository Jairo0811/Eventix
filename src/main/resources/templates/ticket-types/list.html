<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Tipos de entrada')}"></head>
<body>
<aside th:replace="~{fragments/sidebar :: sidebar('events')}"></aside>
<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="app-main">
    <div th:replace="~{fragments/messages :: messages}"></div>

    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
        <div>
            <a class="text-decoration-none small"
               th:href="@{/events/{id}(id=${event.id})}">
                <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>
                Volver al evento
            </a>
            <h1 class="page-title mt-2">Tipos de entrada</h1>
            <p class="page-subtitle" th:text="${event.title}">Evento</p>
        </div>
        <a class="btn btn-primary"
           th:href="@{/events/{id}/ticket-types/new(id=${event.id})}">
            <i class="bi bi-plus-lg me-2" aria-hidden="true"></i>
            Nuevo tipo
        </a>
    </div>

    <section class="content-card">
        <div class="table-responsive" th:if="${!ticketTypes.isEmpty()}">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>Tipo</th>
                    <th>Precio</th>
                    <th>Capacidad</th>
                    <th>Asignadas</th>
                    <th>Disponibles</th>
                    <th>Estado</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="ticketType : ${ticketTypes}">
                    <td>
                        <strong class="d-block" th:text="${ticketType.name}">General</strong>
                        <span class="text-secondary small"
                              th:text="${ticketType.category.displayName}">General</span>
                    </td>
                    <td th:text="|RD$ ${#numbers.formatDecimal(ticketType.price, 1, 'COMMA', 2, 'POINT')}|">
                        RD$ 0.00
                    </td>
                    <td th:text="${ticketType.capacity}">0</td>
                    <td th:text="${ticketType.allocatedQuantity}">0</td>
                    <td class="fw-semibold text-success"
                        th:text="${ticketType.availableQuantity}">0</td>
                    <td>
                        <span class="badge-status"
                              th:classappend="${ticketType.active} ? ' badge-active' : ' badge-inactive'"
                              th:text="${ticketType.active} ? 'Activo' : 'Inactivo'">
                            Activo
                        </span>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/events/{eventId}/ticket-types/{id}/edit(eventId=${event.id},id=${ticketType.id})}">
                            Editar
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty-state" th:if="${ticketTypes.isEmpty()}">
            <i class="bi bi-ticket-perforated fs-1" aria-hidden="true"></i>
            <h2 class="h5 mt-3">Aún no hay tipos de entrada</h2>
            <p>Configura al menos uno antes de crear ventas para este evento.</p>
        </div>
    </section>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</main>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
