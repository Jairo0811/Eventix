<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Verificaciones escolares')}"></head>
<body><aside th:replace="~{fragments/sidebar :: sidebar('school-promotions')}"></aside><header th:replace="~{fragments/navbar :: navbar}"></header>
<main class="app-main"><div th:replace="~{fragments/messages :: messages}"></div>
    <div class="d-flex justify-content-between align-items-center gap-3 mb-4"><div><h1 class="page-title mb-1">Verificaciones escolares</h1><p class="text-muted mb-0">Aprueba discrepancias de identidad y conserva la trazabilidad de cada decisión.</p></div><a class="btn btn-outline-primary" th:href="@{/school-promotions}">Promociones</a></div>
    <section class="content-card"><div class="alert alert-light border" th:if="${#lists.isEmpty(verifications)}">No existen verificaciones registradas.</div>
        <div class="table-responsive" th:unless="${#lists.isEmpty(verifications)}"><table class="table align-middle"><thead><tr><th>Usuario</th><th>Promoción</th><th>Cédula</th><th>Estado</th><th>Motivo</th><th>Acción</th></tr></thead><tbody>
        <tr th:each="verification : ${verifications}"><td th:text="${verification.userName}"></td><td><strong th:text="${verification.institutionName}"></strong><div class="small text-muted" th:text="|${verification.promotionName} ${verification.graduationYear}|"></div></td><td th:text="|•••• ${verification.nationalIdLast4}|"></td><td><span class="badge" th:classappend="${verification.status.name() == 'VERIFIED'} ? ' text-bg-success' : (${verification.status.name() == 'MANUAL_REVIEW'} ? ' text-bg-warning' : ' text-bg-secondary')" th:text="${verification.status}"></span></td><td class="small" th:text="${verification.reason != null ? verification.reason : '—'}"></td><td style="min-width:280px"><form th:if="${verification.status.name() == 'MANUAL_REVIEW'}" th:action="@{/school-promotions/verifications/{id}/approve(id=${verification.id})}" method="post" class="d-flex gap-2 mb-2"><input class="form-control form-control-sm" name="reason" maxlength="500" placeholder="Justificación" required><button class="btn btn-sm btn-success">Aprobar</button></form><form th:if="${verification.status.name() == 'MANUAL_REVIEW'}" th:action="@{/school-promotions/verifications/{id}/reject(id=${verification.id})}" method="post" class="d-flex gap-2"><input class="form-control form-control-sm" name="reason" maxlength="500" placeholder="Motivo de rechazo" required><button class="btn btn-sm btn-outline-danger">Rechazar</button></form><form th:if="${verification.status.name() == 'VERIFIED'}" th:action="@{/school-promotions/verifications/{id}/revoke(id=${verification.id})}" method="post" class="d-flex gap-2"><input class="form-control form-control-sm" name="reason" maxlength="500" placeholder="Motivo de revocación" required><button class="btn btn-sm btn-outline-danger">Revocar</button></form></td></tr>
        </tbody></table></div>
    </section>
</main></body></html>
