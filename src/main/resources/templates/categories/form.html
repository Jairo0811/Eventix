<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Categoría')}"></head>
<body>
<aside th:replace="~{fragments/sidebar :: sidebar('categories')}"></aside>
<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="app-main">
    <div class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-4">
        <div>
            <a class="text-decoration-none small" th:href="@{/categories}">
                <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>
                Volver a categorías
            </a>
            <h1 class="page-title mt-2"
                th:text="${formMode == 'create'
                         ? 'Crear categoría'
                         : 'Editar categoría'}">
                Categoría
            </h1>
            <p class="page-subtitle">
                Define una clasificación clara para la agenda de eventos.
            </p>
        </div>
    </div>

    <section class="content-card mx-auto" style="max-width: 720px;">
        <form th:action="${formMode == 'create'}
                         ? @{/categories}
                         : @{/categories/{id}(id=${categoryId})}"
              th:object="${categoryForm}"
              method="post"
              novalidate>
            <div class="mb-4">
                <label class="form-label fw-semibold" for="name">Nombre</label>
                <input class="form-control"
                       th:errorclass="is-invalid"
                       id="name"
                       th:field="*{name}"
                       type="text"
                       maxlength="80">
                <div class="invalid-feedback" th:errors="*{name}"></div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold" for="description">
                    Descripción
                </label>
                <textarea class="form-control"
                          th:errorclass="is-invalid"
                          id="description"
                          th:field="*{description}"
                          rows="4"
                          maxlength="240"></textarea>
                <div class="invalid-feedback" th:errors="*{description}"></div>
            </div>
            <div class="d-flex justify-content-end gap-2">
                <a class="btn btn-light" th:href="@{/categories}">Cancelar</a>
                <button class="btn btn-primary" type="submit">
                    <i class="bi bi-check2-circle me-2" aria-hidden="true"></i>
                    Guardar categoría
                </button>
            </div>
        </form>
    </section>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</main>

<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
