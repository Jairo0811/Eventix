<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Comprobante de venta')}"></head>
<body class="receipt-page">
<main class="receipt-sheet">
    <div class="receipt-actions">
        <a class="btn btn-light" th:href="@{/sales/{id}(id=${sale.id})}">Volver</a>
        <button class="btn btn-primary" type="button" onclick="window.print()">
            Imprimir / Guardar PDF
        </button>
    </div>

    <header class="receipt-header">
        <img th:src="@{/images/eventix-logo.svg}" alt="Eventix">
        <div class="text-end">
            <p class="detail-label mb-1">Comprobante de venta</p>
            <strong th:text="${sale.referenceCode}">SAL-</strong>
        </div>
    </header>

    <section class="receipt-grid">
        <div><span>Evento</span><strong th:text="${sale.eventTitle}">Evento</strong></div>
        <div><span>Comprador</span><strong th:text="${sale.buyerName}">Nombre</strong></div>
        <div><span>Reservación</span><strong th:text="${sale.reservationReference}">RES-</strong></div>
        <div><span>Estado</span><strong th:text="${sale.status.displayName}">Pagada</strong></div>
        <div><span>Fecha de venta</span><strong th:text="${#temporals.format(sale.createdAt, 'dd/MM/yyyy HH:mm')}">Fecha</strong></div>
        <div><span>Moneda</span><strong th:text="${sale.currency}">DOP</strong></div>
    </section>

    <table class="receipt-table">
        <thead><tr><th>Tipo de entrada</th><th>Cantidad</th><th>Precio</th><th>Subtotal</th></tr></thead>
        <tbody><tr th:each="item : ${sale.items}">
            <td th:text="${item.ticketTypeName}">General</td>
            <td th:text="${item.quantity}">1</td>
            <td th:text="|RD$ ${#numbers.formatDecimal(item.unitPrice, 1, 'COMMA', 2, 'POINT')}|">0</td>
            <td th:text="|RD$ ${#numbers.formatDecimal(item.subtotal, 1, 'COMMA', 2, 'POINT')}|">0</td>
        </tr></tbody>
        <tfoot><tr><th colspan="3">Total</th><th
            th:text="|RD$ ${#numbers.formatDecimal(sale.total, 1, 'COMMA', 2, 'POINT')}|">0</th></tr></tfoot>
    </table>

    <p class="receipt-note">
        Este comprobante documenta la operación comercial. La boleta digital con QR se genera en el módulo de ticketing.
    </p>
</main>
</body>
</html>
