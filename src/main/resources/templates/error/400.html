<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Solicitud inválida')}"></head>
<body class="d-flex align-items-center justify-content-center py-5">
<main class="container text-center" style="max-width: 620px;">
    <div class="content-card p-5">
        <p class="text-warning fw-bold">ERROR 400</p>
        <h1 class="page-title mb-3">No podemos procesar esa solicitud</h1>
        <p class="text-secondary mb-4"
           th:text="${message ?: 'Revisa los datos enviados e inténtalo nuevamente.'}">
            Revisa los datos enviados.
        </p>
        <a class="btn btn-primary" th:href="@{/dashboard}">Volver al dashboard</a>
    </div>
</main>
</body>
</html>
