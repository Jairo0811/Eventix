<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Eventos')}"></head>
<body>
<aside th:replace="~{fragments/sidebar :: sidebar('events')}"></aside>
<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="app-main">
    <div th:replace="~{fragments/messages :: messages}"></div>

    <div class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-4">
        <div>
            <p class="text-success fw-semibold mb-1">Programación y experiencias</p>
            <h1 class="page-title">Eventos</h1>
            <p class="page-subtitle">
                Consulta, filtra y administra la agenda de Eventix.
            </p>
        </div>
        <a class="btn btn-primary"
           sec:authorize="hasAnyRole('ADMINISTRATOR', 'ORGANIZER')"
           th:href="@{/events/new}">
            <i class="bi bi-calendar-plus-fill me-2" aria-hidden="true"></i>
            Nuevo evento
        </a>
    </div>

    <section class="content-card mb-4">
        <form class="row g-3" method="get" th:action="@{/events}">
            <div class="col-12 col-lg-5">
                <label class="form-label" for="term">Buscar</label>
                <div class="input-group">
                    <span class="input-group-text bg-white">
                        <i class="bi bi-search" aria-hidden="true"></i>
                    </span>
                    <input class="form-control"
                           id="term"
                           name="term"
                           type="search"
                           th:value="${term}"
                           placeholder="Título, lugar u organizador">
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <label class="form-label" for="status">Estado</label>
                <select class="form-select" id="status" name="status">
                    <option value="">Todos</option>
                    <option th:each="statusOption : ${statuses}"
                            th:value="${statusOption}"
                            th:text="${statusOption.displayName}"
                            th:selected="${statusOption == selectedStatus}">
                        Publicado
                    </option>
                </select>
            </div>
            <div class="col-6 col-lg-3">
                <label class="form-label" for="categoryId">Categoría</label>
                <select class="form-select" id="categoryId" name="categoryId">
                    <option value="">Todas</option>
                    <option th:each="category : ${categories}"
                            th:value="${category.id}"
                            th:text="${category.name}"
                            th:selected="${category.id == selectedCategoryId}">
                        Conferencia
                    </option>
                </select>
            </div>
            <div class="col-12 col-lg-1 d-flex align-items-end">
                <button class="btn btn-outline-primary w-100"
                        type="submit"
                        aria-label="Aplicar filtros">
                    <i class="bi bi-funnel" aria-hidden="true"></i>
                </button>
            </div>
        </form>
    </section>

    <div class="row g-4" th:if="${events.hasContent()}">
        <div class="col-12 col-md-6 col-xl-4"
             th:each="event : ${events.content}">
            <article class="event-card h-100">
                <div class="event-card-cover">
                    <img th:src="${event.coverImageUrl != null
                                  ? event.coverImageUrl
                                  : '/images/eventix-logo.png'}"
                         th:alt="|Portada de ${event.title}|">
                    <span class="badge-status event-status-badge"
                          th:classappend="| badge-event-${#strings.toLowerCase(event.status.name())}|"
                          th:text="${event.status.displayName}">
                        Publicado
                    </span>
                </div>
                <div class="event-card-body">
                    <div class="d-flex justify-content-between gap-3 mb-2">
                        <span class="event-category"
                              th:text="${event.categoryName}">
                            Conferencia
                        </span>
                        <span class="event-price"
                              th:text="${event.freeEvent
                                      ? 'Gratis'
                                      : 'RD$ ' + #numbers.formatDecimal(event.basePrice, 1, 2)}">
                            Gratis
                        </span>
                    </div>
                    <h2 class="h5 fw-bold mb-3" th:text="${event.title}">
                        Nombre del evento
                    </h2>
                    <dl class="event-meta mb-4">
                        <div>
                            <dt><i class="bi bi-calendar3" aria-hidden="true"></i></dt>
                            <dd th:text="${#temporals.format(event.startAt, 'dd/MM/yyyy · hh:mm a')}">
                                30/07/2026
                            </dd>
                        </div>
                        <div>
                            <dt><i class="bi bi-geo-alt" aria-hidden="true"></i></dt>
                            <dd th:text="${event.venue}">Lugar</dd>
                        </div>
                        <div>
                            <dt><i class="bi bi-person-badge" aria-hidden="true"></i></dt>
                            <dd th:text="${event.organizerName}">Organizador</dd>
                        </div>
                    </dl>
                    <a class="btn btn-outline-primary w-100"
                       th:href="@{/events/{id}(id=${event.id})}">
                        Ver evento
                        <i class="bi bi-arrow-right ms-2" aria-hidden="true"></i>
                    </a>
                </div>
            </article>
        </div>
    </div>

    <section class="content-card empty-state"
             th:unless="${events.hasContent()}">
        <i class="bi bi-calendar2-x fs-1 d-block mb-3" aria-hidden="true"></i>
        <h2 class="h5 text-dark">No encontramos eventos</h2>
        <p class="mb-0">
            Cambia los filtros o registra una nueva experiencia.
        </p>
    </section>

    <nav class="d-flex justify-content-between align-items-center mt-4"
         aria-label="Paginación de eventos"
         th:if="${events.totalPages > 1}">
        <span class="text-secondary small"
              th:text="|Página ${events.number + 1} de ${events.totalPages}|">
            Página 1
        </span>
        <div class="btn-group">
            <a class="btn btn-sm btn-outline-secondary"
               th:classappend="${events.first} ? ' disabled'"
               th:href="@{/events(
                    term=${term},
                    status=${selectedStatus},
                    categoryId=${selectedCategoryId},
                    page=${events.number - 1})}">
                Anterior
            </a>
            <a class="btn btn-sm btn-outline-secondary"
               th:classappend="${events.last} ? ' disabled'"
               th:href="@{/events(
                    term=${term},
                    status=${selectedStatus},
                    categoryId=${selectedCategoryId},
                    page=${events.number + 1})}">
                Siguiente
            </a>
        </div>
    </nav>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</main>

<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
