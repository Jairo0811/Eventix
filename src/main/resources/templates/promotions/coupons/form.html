<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Cupón')}"></head>
<body>
<aside th:replace="~{fragments/sidebar :: sidebar('coupons')}"></aside>
<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="app-main">
    <div class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-4">
        <div>
            <a class="text-decoration-none small" th:href="@{/promotions/coupons}">
                <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>
                Volver a promociones
            </a>
            <h1 class="page-title mt-2"
                th:text="${formMode == 'create' ? 'Crear cupón' : 'Editar cupón'}">
                Cupón
            </h1>
            <p class="page-subtitle">
                El servidor aplicará estas reglas al subtotal real de la venta.
            </p>
        </div>
    </div>

    <form class="content-card" th:object="${couponForm}"
          th:action="${formMode == 'create'}
                     ? @{/promotions/coupons}
                     : @{/promotions/coupons/{id}(id=${couponId})}"
          method="post" novalidate>
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <p class="mb-0" th:each="error : ${#fields.globalErrors()}"
               th:text="${error}">Error</p>
        </div>

        <div class="row g-4">
            <div class="col-md-5">
                <label class="form-label fw-semibold" for="code">Código</label>
                <input class="form-control text-uppercase" id="code"
                       th:field="*{code}" th:errorclass="is-invalid"
                       maxlength="40" autocomplete="off">
                <div class="invalid-feedback" th:errors="*{code}"></div>
            </div>
            <div class="col-md-7">
                <label class="form-label fw-semibold" for="description">Descripción</label>
                <input class="form-control" id="description"
                       th:field="*{description}" th:errorclass="is-invalid"
                       maxlength="240">
                <div class="invalid-feedback" th:errors="*{description}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold" for="discountType">Tipo</label>
                <select class="form-select" id="discountType"
                        th:field="*{discountType}" th:errorclass="is-invalid">
                    <option value="">Selecciona</option>
                    <option th:each="type : ${discountTypes}"
                            th:value="${type}" th:text="${type.displayName}">Tipo</option>
                </select>
                <div class="invalid-feedback" th:errors="*{discountType}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold" for="value">Valor</label>
                <input class="form-control" id="value" type="number"
                       step="0.01" min="0.01" th:field="*{value}"
                       th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{value}"></div>
            </div>
            <div class="col-md-4 d-flex align-items-end">
                <div class="form-check form-switch mb-2">
                    <input class="form-check-input" id="active" type="checkbox"
                           th:field="*{active}">
                    <label class="form-check-label fw-semibold" for="active">
                        Disponible para nuevos usos
                    </label>
                </div>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold" for="startsAt">Inicio</label>
                <input class="form-control" id="startsAt" type="datetime-local"
                       th:field="*{startsAt}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{startsAt}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold" for="expiresAt">Expiración</label>
                <input class="form-control" id="expiresAt" type="datetime-local"
                       th:field="*{expiresAt}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{expiresAt}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold" for="totalUseLimit">
                    Límite total
                </label>
                <input class="form-control" id="totalUseLimit" type="number"
                       min="1" th:field="*{totalUseLimit}"
                       th:errorclass="is-invalid" placeholder="Sin límite">
                <div class="invalid-feedback" th:errors="*{totalUseLimit}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold" for="perUserLimit">
                    Límite por comprador
                </label>
                <input class="form-control" id="perUserLimit" type="number"
                       min="1" th:field="*{perUserLimit}"
                       th:errorclass="is-invalid" placeholder="Sin límite">
                <div class="invalid-feedback" th:errors="*{perUserLimit}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold" for="minimumSubtotal">
                    Subtotal mínimo (RD$)
                </label>
                <input class="form-control" id="minimumSubtotal" type="number"
                       min="0" step="0.01" th:field="*{minimumSubtotal}"
                       th:errorclass="is-invalid" placeholder="Sin mínimo">
                <div class="invalid-feedback" th:errors="*{minimumSubtotal}"></div>
            </div>
            <div class="col-12">
                <label class="form-label fw-semibold" for="eventIds">
                    Eventos aplicables
                </label>
                <select class="form-select" id="eventIds" th:field="*{eventIds}"
                        th:errorclass="is-invalid" multiple size="7">
                    <option th:each="event : ${events}" th:value="${event.id}"
                            th:text="${event.title}">Evento</option>
                </select>
                <div class="form-text">
                    Mantén Ctrl (Windows/Linux) o ⌘ (macOS) para seleccionar varios.
                </div>
                <div class="invalid-feedback" th:errors="*{eventIds}"></div>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4">
            <a class="btn btn-light" th:href="@{/promotions/coupons}">Cancelar</a>
            <button class="btn btn-primary" type="submit">
                <i class="bi bi-check2-circle me-2" aria-hidden="true"></i>
                Guardar cupón
            </button>
        </div>
    </form>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</main>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
