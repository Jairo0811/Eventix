<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Usuarios')}"></head>
<body>
<aside th:replace="~{fragments/sidebar :: sidebar('users')}"></aside>
<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="app-main">
    <div th:replace="~{fragments/messages :: messages}"></div>

    <div class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-4">
        <div>
            <p class="text-success fw-semibold mb-1">Seguridad y acceso</p>
            <h1 class="page-title">Usuarios</h1>
            <p class="page-subtitle">Administra las cuentas y permisos de Eventix.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/users/new}">
            <i class="bi bi-person-plus-fill me-2" aria-hidden="true"></i>
            Nuevo usuario
        </a>
    </div>

    <section class="content-card">
        <form class="row g-3 mb-4" method="get" th:action="@{/users}">
            <div class="col-12 col-md-7">
                <label class="form-label" for="term">Buscar</label>
                <div class="input-group">
                    <span class="input-group-text bg-white">
                        <i class="bi bi-search" aria-hidden="true"></i>
                    </span>
                    <input class="form-control"
                           id="term"
                           name="term"
                           type="search"
                           th:value="${term}"
                           placeholder="Nombre, correo o usuario">
                </div>
            </div>
            <div class="col-8 col-md-3">
                <label class="form-label" for="status">Estado</label>
                <select class="form-select" id="status" name="status">
                    <option value="">Todos</option>
                    <option th:each="statusOption : ${statuses}"
                            th:value="${statusOption}"
                            th:text="${statusOption.displayName}"
                            th:selected="${statusOption == selectedStatus}">
                        Activo
                    </option>
                </select>
            </div>
            <div class="col-4 col-md-2 d-flex align-items-end">
                <button class="btn btn-outline-primary w-100" type="submit">Filtrar</button>
            </div>
        </form>

        <div class="table-responsive" th:if="${users.hasContent()}">
            <table class="table">
                <thead>
                <tr>
                    <th scope="col">Usuario</th>
                    <th scope="col">Rol</th>
                    <th scope="col">Estado</th>
                    <th scope="col">Último acceso</th>
                    <th scope="col" class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users.content}">
                    <td>
                        <div class="d-flex align-items-center gap-3">
                            <span class="user-avatar"
                                  th:text="${#strings.substring(user.firstName, 0, 1) + #strings.substring(user.lastName, 0, 1)}">
                                EV
                            </span>
                            <div>
                                <strong class="d-block" th:text="${user.fullName()}">Nombre</strong>
                                <span class="text-secondary small" th:text="${user.email}">correo</span>
                            </div>
                        </div>
                    </td>
                    <td th:text="${user.roleName.displayName}">Administrador</td>
                    <td>
                        <span class="badge-status"
                              th:classappend="${user.status.name() == 'ACTIVE'} ? ' badge-active' : (${user.status.name() == 'LOCKED'} ? ' badge-locked' : ' badge-inactive')"
                              th:text="${user.status.displayName}">
                            Activo
                        </span>
                    </td>
                    <td class="text-secondary small"
                        th:text="${user.lastLoginAt != null ? #temporals.format(user.lastLoginAt, 'dd/MM/yyyy HH:mm') : 'Nunca'}">
                        Nunca
                    </td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-light"
                           th:href="@{/users/{id}(id=${user.id})}"
                           aria-label="Ver detalle">
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </a>
                        <a class="btn btn-sm btn-light"
                           th:href="@{/users/{id}/edit(id=${user.id})}"
                           aria-label="Editar usuario">
                            <i class="bi bi-pencil" aria-hidden="true"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty-state" th:unless="${users.hasContent()}">
            <i class="bi bi-people fs-1 d-block mb-3" aria-hidden="true"></i>
            <h2 class="h5 text-dark">No encontramos usuarios</h2>
            <p class="mb-0">Cambia los filtros o crea una cuenta nueva.</p>
        </div>

        <nav class="d-flex justify-content-between align-items-center mt-4"
             aria-label="Paginación de usuarios"
             th:if="${users.totalPages > 1}">
            <span class="text-secondary small"
                  th:text="|Página ${users.number + 1} de ${users.totalPages}|">Página 1</span>
            <div class="btn-group">
                <a class="btn btn-sm btn-outline-secondary"
                   th:classappend="${users.first} ? ' disabled'"
                   th:href="@{/users(term=${term},status=${selectedStatus},page=${users.number - 1})}">
                    Anterior
                </a>
                <a class="btn btn-sm btn-outline-secondary"
                   th:classappend="${users.last} ? ' disabled'"
                   th:href="@{/users(term=${term},status=${selectedStatus},page=${users.number + 1})}">
                    Siguiente
                </a>
            </div>
        </nav>
    </section>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</main>

<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
