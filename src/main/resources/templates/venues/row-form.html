<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Nueva fila')}"></head>
<body>
<aside th:replace="~{fragments/sidebar :: sidebar('venues')}"></aside>
<header th:replace="~{fragments/navbar :: navbar}"></header>
<main class="app-main">
    <a class="text-decoration-none small" th:href="@{/venues/{id}/layout(id=${venueId})}"><i class="bi bi-arrow-left me-1"></i>Volver al layout</a>
    <h1 class="page-title mt-2">Nueva fila</h1>
    <section class="content-card mx-auto mt-4" style="max-width:720px;">
        <form th:action="@{/venues/{venueId}/layout/sections/{sectionId}/rows(venueId=${venueId},sectionId=${sectionId})}" th:object="${rowForm}" method="post" novalidate>
            <div class="row g-4">
                <div class="col-md-4"><label class="form-label" for="code">Código</label><input class="form-control" th:errorclass="is-invalid" id="code" th:field="*{code}" maxlength="40"><div class="invalid-feedback" th:errors="*{code}"></div></div>
                <div class="col-md-5"><label class="form-label" for="label">Etiqueta</label><input class="form-control" th:errorclass="is-invalid" id="label" th:field="*{label}" maxlength="80"><div class="invalid-feedback" th:errors="*{label}"></div></div>
                <div class="col-md-3"><label class="form-label" for="sortOrder">Orden</label><input class="form-control" id="sortOrder" th:field="*{sortOrder}" type="number" min="0"><div class="invalid-feedback" th:errors="*{sortOrder}"></div></div>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-light" th:href="@{/venues/{id}/layout(id=${venueId})}">Cancelar</a><button class="btn btn-primary" type="submit">Guardar fila</button></div>
        </form>
    </section>
</main>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
