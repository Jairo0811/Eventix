<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Layout del recinto')}"></head>
<body>
<aside th:replace="~{fragments/sidebar :: sidebar('venues')}"></aside>
<header th:replace="~{fragments/navbar :: navbar}"></header>
<main class="app-main">
    <div th:replace="~{fragments/messages :: messages}"></div>
    <div class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-4">
        <div>
            <a class="text-decoration-none small" th:href="@{/venues}"><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Volver a recintos</a>
            <h1 class="page-title mt-2" th:text="\${layout.name}">Recinto</h1>
            <p class="page-subtitle" th:text="|\${layout.address}, \${layout.city} (\${layout.countryCode})|">Ubicación</p>
        </div>
        <a class="btn btn-primary" th:href="@{/venues/{id}/layout/sections/new(id=\${layout.id})}">
            <i class="bi bi-grid-3x3-gap-fill me-2" aria-hidden="true"></i>Nueva sección
        </a>
    </div>

    <div class="empty-state content-card" th:if="\${#lists.isEmpty(layout.sections)}">
        <i class="bi bi-diagram-3 fs-1 d-block mb-3" aria-hidden="true"></i>
        <h2 class="h5 text-dark">El recinto todavía no tiene secciones</h2>
        <p class="mb-0">Crea la primera zona para comenzar a construir el mapa de asientos.</p>
    </div>

    <section class="content-card mb-4" th:each="section : \${layout.sections}">
        <div class="d-flex flex-wrap justify-content-between gap-3 mb-3">
            <div>
                <div class="d-flex align-items-center gap-2">
                    <h2 class="h5 mb-0" th:text="\${section.name}">Sección</h2>
                    <span class="badge text-bg-light" th:text="\${section.code}">VIP-A</span>
                </div>
                <p class="text-secondary small mb-0" th:text="|\${section.type} · capacidad \${section.capacity}|">Tipo</p>
            </div>
            <a class="btn btn-sm btn-outline-primary"
               th:href="@{/venues/{venueId}/layout/sections/{sectionId}/rows/new(venueId=\${layout.id},sectionId=\${section.id})}">
                <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Agregar fila
            </a>
        </div>

        <div class="border rounded p-3 mb-3" th:each="row : \${section.rows}">
            <div class="d-flex justify-content-between align-items-center gap-2 mb-3">
                <div>
                    <strong th:text="\${row.label}">Fila A</strong>
                    <span class="text-secondary small ms-2" th:text="|(\${row.code})|">(A)</span>
                </div>
                <a class="btn btn-sm btn-light"
                   th:href="@{/venues/{venueId}/layout/sections/{sectionId}/rows/{rowId}/seats/new(venueId=\${layout.id},sectionId=\${section.id},rowId=\${row.id})}">
                    <i class="bi bi-plus-circle me-1" aria-hidden="true"></i>Asiento
                </a>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <span class="badge rounded-pill text-bg-light border"
                      th:each="seat : \${row.seats}"
                      th:title="\${seat.accessible ? 'Asiento accesible' : (seat.companionSeat ? 'Asiento acompañante' : 'Asiento')}"
                      th:text="\${seat.label}">
                    A-1
                </span>
                <span class="text-secondary small" th:if="\${#lists.isEmpty(row.seats)}">Sin asientos configurados.</span>
            </div>
        </div>

        <p class="text-secondary small mb-0" th:if="\${#lists.isEmpty(section.rows)}">Esta sección aún no tiene filas.</p>
    </section>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</main>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
