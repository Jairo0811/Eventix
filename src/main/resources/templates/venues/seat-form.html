<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Nuevo asiento')}"></head>
<body>
<aside th:replace="~{fragments/sidebar :: sidebar('venues')}"></aside>
<header th:replace="~{fragments/navbar :: navbar}"></header>
<main class="app-main">
    <a class="text-decoration-none small" th:href="@{/venues/{id}/layout(id=\${venueId})}"><i class="bi bi-arrow-left me-1"></i>Volver al layout</a>
    <h1 class="page-title mt-2">Nuevo asiento</h1>
    <section class="content-card mx-auto mt-4" style="max-width:720px;">
        <form th:action="@{/venues/{venueId}/layout/sections/{sectionId}/rows/{rowId}/seats(venueId=\${venueId},sectionId=\${sectionId},rowId=\${rowId})}" th:object="\${seatForm}" method="post" novalidate>
            <div class="row g-4">
                <div class="col-md-4"><label class="form-label" for="seatNumber">Número</label><input class="form-control" th:errorclass="is-invalid" id="seatNumber" th:field="*{seatNumber}" maxlength="20"><div class="invalid-feedback" th:errors="*{seatNumber}"></div></div>
                <div class="col-md-8"><label class="form-label" for="label">Etiqueta visible</label><input class="form-control" th:errorclass="is-invalid" id="label" th:field="*{label}" maxlength="80" placeholder="Ej. A-12"><div class="invalid-feedback" th:errors="*{label}"></div></div>
                <div class="col-12"><div class="form-check form-switch"><input class="form-check-input" id="accessible" th:field="*{accessible}" type="checkbox"><label class="form-check-label" for="accessible">Asiento accesible</label></div></div>
                <div class="col-12"><div class="form-check form-switch"><input class="form-check-input" id="companionSeat" th:field="*{companionSeat}" type="checkbox"><label class="form-check-label" for="companionSeat">Asiento para acompañante</label></div></div>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-light" th:href="@{/venues/{id}/layout(id=\${venueId})}">Cancelar</a><button class="btn btn-primary" type="submit">Guardar asiento</button></div>
        </form>
    </section>
</main>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
