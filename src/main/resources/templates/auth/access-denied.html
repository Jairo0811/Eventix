<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Acceso denegado')}"></head>
<body class="d-flex align-items-center justify-content-center py-5">
<main class="container text-center" style="max-width: 620px;">
    <div class="content-card p-5">
        <div class="metric-icon mx-auto mb-4">
            <i class="bi bi-shield-lock-fill" aria-hidden="true"></i>
        </div>
        <p class="text-danger fw-semibold">Error 403</p>
        <h1 class="page-title mb-3">No tienes permiso para entrar aquí</h1>
        <p class="text-secondary mb-4">
            Tu sesión es válida, pero el rol asignado no autoriza esta operación.
        </p>
        <a class="btn btn-primary" th:href="@{/dashboard}">
            <i class="bi bi-arrow-left me-2" aria-hidden="true"></i>
            Volver al dashboard
        </a>
    </div>
</main>
</body>
</html>
