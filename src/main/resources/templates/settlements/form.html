<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Nueva liquidación')}"></head>
<body>
<aside th:replace="~{fragments/sidebar :: sidebar('settlements')}"></aside>
<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="app-main">
    <div class="mb-4">
        <a class="text-decoration-none small" th:href="@{/settlements}">
            <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>
            Volver a liquidaciones
        </a>
        <h1 class="page-title mt-2">Crear liquidación</h1>
        <p class="page-subtitle">
            Eventix incluirá solo movimientos elegibles aún no liquidados.
        </p>
    </div>

    <form class="content-card mx-auto" style="max-width: 820px;"
          th:object="${settlementForm}" th:action="@{/settlements}"
          method="post" novalidate>
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <p class="mb-0" th:each="error : ${#fields.globalErrors()}"
               th:text="${error}">Error</p>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold" for="organizerId">Organizador</label>
            <select class="form-select" id="organizerId"
                    th:field="*{organizerId}" th:errorclass="is-invalid">
                <option value="">Selecciona</option>
                <option th:each="organizer : ${organizers}"
                        th:value="${organizer.id}"
                        th:text="${organizer.fullName}">Organizador</option>
            </select>
            <div class="invalid-feedback" th:errors="*{organizerId}"></div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <label class="form-label fw-semibold" for="periodFrom">Desde</label>
                <input class="form-control" id="periodFrom" type="date"
                       th:field="*{periodFrom}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{periodFrom}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold" for="periodTo">Hasta</label>
                <input class="form-control" id="periodTo" type="date"
                       th:field="*{periodTo}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{periodTo}"></div>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold" for="administrativeNotes">
                Observaciones administrativas
            </label>
            <textarea class="form-control" id="administrativeNotes" rows="4"
                      maxlength="1000" th:field="*{administrativeNotes}"
                      th:errorclass="is-invalid"></textarea>
            <div class="invalid-feedback" th:errors="*{administrativeNotes}"></div>
        </div>

        <div class="alert alert-light border small">
            El cálculo incluirá ventas por fecha de pago y reembolsos por fecha de devolución.
            Cada efecto financiero activo solo puede pertenecer a una liquidación.
        </div>

        <div class="d-flex justify-content-end gap-2">
            <a class="btn btn-light" th:href="@{/settlements}">Cancelar</a>
            <button class="btn btn-primary" type="submit">
                <i class="bi bi-calculator me-2" aria-hidden="true"></i>
                Calcular y crear
            </button>
        </div>
    </form>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</main>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
