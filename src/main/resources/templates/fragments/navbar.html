<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<header class="app-topbar" th:fragment="navbar">
    <form id="eventix-logout-form" th:action="@{/logout}" method="post" class="d-none"></form>

    <div class="d-flex align-items-center gap-3">
        <button class="btn btn-light mobile-menu-button"
                type="button"
                data-sidebar-toggle
                aria-label="Abrir menú">
            <i class="bi bi-list fs-5" aria-hidden="true"></i>
        </button>
        <div class="d-none d-sm-block">
            <span class="text-secondary small">Transforma tus eventos.</span>
        </div>
    </div>

    <div class="d-flex align-items-center gap-2">
        <a class="btn btn-light" th:href="@{/notifications}" aria-label="Abrir centro de notificaciones" title="Notificaciones">
            <i class="bi bi-bell-fill" aria-hidden="true"></i>
        </a>
        <div class="dropdown">
            <button class="btn btn-light dropdown-toggle d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <span class="user-avatar"><i class="bi bi-person-fill" aria-hidden="true"></i></span>
                <span class="d-none d-md-inline text-start">
                    <strong class="d-block small" sec:authentication="name">usuario</strong>
                    <span class="text-secondary" style="font-size: .72rem;">Cuenta Eventix</span>
                </span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">
                <li><a class="dropdown-item" th:href="@{/notifications}"><i class="bi bi-bell me-2" aria-hidden="true"></i>Notificaciones</a></li>
                <li><a class="dropdown-item" th:href="@{/profile}"><i class="bi bi-person-circle me-2" aria-hidden="true"></i>Mi perfil</a></li>
                <li><a class="dropdown-item" th:href="@{/auth/change-password}"><i class="bi bi-shield-lock me-2" aria-hidden="true"></i>Cambiar contraseña</a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <button class="dropdown-item text-danger"
                            type="submit"
                            form="eventix-logout-form">
                        <i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>Cerrar sesión
                    </button>
                </li>
            </ul>
        </div>
    </div>
</header>
</html>
