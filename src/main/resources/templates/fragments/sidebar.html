<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<aside class="app-sidebar" th:fragment="sidebar(activePage)">
    <a th:href="@{/dashboard}" aria-label="Ir al dashboard">
        <img class="sidebar-logo" th:src="@{/images/eventix-logo.svg}" alt="Eventix">
    </a>

    <p class="sidebar-label">Principal</p>
    <nav class="nav flex-column sidebar-nav" aria-label="Navegación principal">
        <a class="nav-link"
           th:classappend="${activePage == 'dashboard'} ? ' active'"
           th:href="@{/dashboard}">
            <i class="bi bi-grid-1x2-fill" aria-hidden="true"></i>
            Dashboard
        </a>
        <a class="nav-link"
           sec:authorize="hasRole('ADMINISTRATOR')"
           th:classappend="${activePage == 'users'} ? ' active'"
           th:href="@{/users}">
            <i class="bi bi-people-fill" aria-hidden="true"></i>
            Usuarios
        </a>
        <a class="nav-link"
           th:classappend="${activePage == 'events'} ? ' active'"
           th:href="@{/events}">
            <i class="bi bi-calendar-event-fill" aria-hidden="true"></i>
            Eventos
        </a>
        <a class="nav-link"
           sec:authorize="hasAnyRole('ADMINISTRATOR', 'OPERATOR', 'ORGANIZER')"
           th:classappend="${activePage == 'reservations'} ? ' active'"
           th:href="@{/reservations}">
            <i class="bi bi-journal-check" aria-hidden="true"></i>
            Reservaciones
        </a>
        <a class="nav-link"
           sec:authorize="hasAnyRole('ADMINISTRATOR', 'OPERATOR', 'ORGANIZER')"
           th:classappend="${activePage == 'sales'} ? ' active'"
           th:href="@{/sales}">
            <i class="bi bi-receipt-cutoff" aria-hidden="true"></i>
            Ventas y pagos
        </a>
        <a class="nav-link"
           sec:authorize="hasAnyRole('ADMINISTRATOR', 'OPERATOR', 'ORGANIZER')"
           th:classappend="${activePage == 'tickets'} ? ' active'"
           th:href="@{/tickets}">
            <i class="bi bi-ticket-perforated" aria-hidden="true"></i>
            Boletas digitales
        </a>
        <a class="nav-link"
           sec:authorize="hasAnyRole('ADMINISTRATOR', 'OPERATOR', 'ORGANIZER', 'ACCESS_STAFF')"
           th:classappend="${activePage == 'access'} ? ' active'"
           th:href="@{/access-control}">
            <i class="bi bi-qr-code-scan" aria-hidden="true"></i>
            Control de acceso
        </a>
        <a class="nav-link"
           sec:authorize="hasAnyRole('ADMINISTRATOR', 'ORGANIZER')"
           th:classappend="${activePage == 'reports'} ? ' active'"
           th:href="@{/reports}">
            <i class="bi bi-bar-chart-line-fill" aria-hidden="true"></i>
            Reportes
        </a>
        <a class="nav-link"
           sec:authorize="hasRole('ADMINISTRATOR')"
           th:classappend="${activePage == 'categories'} ? ' active'"
           th:href="@{/categories}">
            <i class="bi bi-tags-fill" aria-hidden="true"></i>
            Categorías
        </a>
        <a class="nav-link"
           sec:authorize="hasRole('ADMINISTRATOR')"
           th:classappend="${activePage == 'audit'} ? ' active'"
           th:href="@{/audit}">
            <i class="bi bi-shield-check" aria-hidden="true"></i>
            Auditoría
        </a>
    </nav>

</aside>
</html>
