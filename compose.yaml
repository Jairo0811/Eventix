name: eventix

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD}
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - eventix-sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SQLCMD=/opt/mssql-tools18/bin/sqlcmd;
          [ -x "$$SQLCMD" ] || SQLCMD=/opt/mssql-tools/bin/sqlcmd;
          "$$SQLCMD" -S localhost -U sa -P "$$MSSQL_SA_PASSWORD"
          -C -b -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  sqlserver-configure:
    image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD}
      EVENTIX_DB_PASSWORD: ${EVENTIX_DB_PASSWORD:?Define EVENTIX_DB_PASSWORD}
      EVENTIX_MIGRATOR_PASSWORD: ${EVENTIX_MIGRATOR_PASSWORD:?Define EVENTIX_MIGRATOR_PASSWORD}
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -u

        SQLCMD=/opt/mssql-tools18/bin/sqlcmd
        [ -x "$$SQLCMD" ] || SQLCMD=/opt/mssql-tools/bin/sqlcmd

        EVENTIX_DB_PASSWORD_SQL=$${EVENTIX_DB_PASSWORD//\'/\'\'}
        EVENTIX_MIGRATOR_PASSWORD_SQL=$${EVENTIX_MIGRATOR_PASSWORD//\'/\'\'}

        MAX_ATTEMPTS=60
        SLEEP_SECONDS=2

        for attempt in $$(seq 1 $$MAX_ATTEMPTS); do
          echo "Intento $$attempt/$$MAX_ATTEMPTS: configurando EventixDb..."

          if "$$SQLCMD" -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" \
            -C -b -v EVENTIX_DB_PASSWORD="$$EVENTIX_DB_PASSWORD_SQL" \
            EVENTIX_MIGRATOR_PASSWORD="$$EVENTIX_MIGRATOR_PASSWORD_SQL" \
            -i /scripts/EventixDb.docker.sql; then
            echo "EventixDb configurada correctamente."
            exit 0
          fi

          if [ "$$attempt" -lt "$$MAX_ATTEMPTS" ]; then
            echo "EventixDb aún no está lista. Reintentando en $$SLEEP_SECONDS segundos..."
            sleep "$$SLEEP_SECONDS"
          fi
        done

        echo "No fue posible configurar EventixDb después de $$MAX_ATTEMPTS intentos." >&2
        exit 1
    volumes:
      - ./docker/EventixDb.docker.sql:/scripts/EventixDb.docker.sql:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  app:
    image: eventix:${EVENTIX_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-dev}
      DB_URL: >-
        jdbc:sqlserver://sqlserver:1433;databaseName=EventixDb;encrypt=true;trustServerCertificate=true
      DB_USERNAME: eventix_app
      DB_PASSWORD: ${EVENTIX_DB_PASSWORD:?Define EVENTIX_DB_PASSWORD}
      FLYWAY_DB_USERNAME: eventix_migrator
      FLYWAY_DB_PASSWORD: ${EVENTIX_MIGRATOR_PASSWORD:?Define EVENTIX_MIGRATOR_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      EVENT_COVER_STORAGE_PATH: /app/data/event-covers
      EVENTIX_ALLOW_DEFAULT_BOOTSTRAP_ADMIN: ${EVENTIX_ALLOW_DEFAULT_BOOTSTRAP_ADMIN:-false}
      EVENTIX_BOOTSTRAP_ADMIN_PASSWORD: ${EVENTIX_BOOTSTRAP_ADMIN_PASSWORD:-}
      EVENTIX_ELIGIBILITY_HMAC_SECRET: ${EVENTIX_ELIGIBILITY_HMAC_SECRET:?Define EVENTIX_ELIGIBILITY_HMAC_SECRET}
      EVENTIX_IDENTITY_DEV_RECORDS: ${EVENTIX_IDENTITY_DEV_RECORDS:-}
      EVENTIX_EMAIL_ENABLED: ${EVENTIX_EMAIL_ENABLED:-false}
      EVENTIX_EMAIL_FROM: ${EVENTIX_EMAIL_FROM:-no-reply@eventix.local}
      EVENTIX_REMINDERS_ENABLED: ${EVENTIX_REMINDERS_ENABLED:-false}
      EVENTIX_REMINDER_ADVANCE: ${EVENTIX_REMINDER_ADVANCE:-PT24H}
      EVENTIX_REMINDER_SCAN_INTERVAL: ${EVENTIX_REMINDER_SCAN_INTERVAL:-PT5M}
      EVENTIX_REMINDER_RETRY_DELAY: ${EVENTIX_REMINDER_RETRY_DELAY:-PT15M}
      EVENTIX_REMINDER_MAX_ATTEMPTS: ${EVENTIX_REMINDER_MAX_ATTEMPTS:-5}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS_ENABLED: ${MAIL_STARTTLS_ENABLED:-false}
      MAIL_CONNECTION_TIMEOUT_MS: ${MAIL_CONNECTION_TIMEOUT_MS:-5000}
      MAIL_READ_TIMEOUT_MS: ${MAIL_READ_TIMEOUT_MS:-5000}
      MAIL_WRITE_TIMEOUT_MS: ${MAIL_WRITE_TIMEOUT_MS:-5000}
      GOOGLE_MAPS_EMBED_API_KEY: ${GOOGLE_MAPS_EMBED_API_KEY:-}
      TICKETING_ISSUER_NAME: ${TICKETING_ISSUER_NAME:-Eventix}
      TICKETING_SIGNING_KEY_ID: ${TICKETING_SIGNING_KEY_ID:-eventix-dev}
      TICKETING_SIGNING_PRIVATE_KEY: ${TICKETING_SIGNING_PRIVATE_KEY:-}
      TICKETING_SIGNING_PUBLIC_KEY: ${TICKETING_SIGNING_PUBLIC_KEY:-}
      TICKETING_VERIFICATION_PUBLIC_KEYS: ${TICKETING_VERIFICATION_PUBLIC_KEYS:-}
      TICKETING_ALLOW_EPHEMERAL_SIGNING_KEY: ${TICKETING_ALLOW_EPHEMERAL_SIGNING_KEY:-false}
      TICKETING_ALLOW_REENTRY: ${TICKETING_ALLOW_REENTRY:-false}
      GOOGLE_WALLET_ENABLED: ${GOOGLE_WALLET_ENABLED:-false}
      GOOGLE_WALLET_ISSUER_ID: ${GOOGLE_WALLET_ISSUER_ID:-}
      GOOGLE_WALLET_SERVICE_ACCOUNT_JSON: ${GOOGLE_WALLET_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_WALLET_ORIGINS: ${GOOGLE_WALLET_ORIGINS:-http://localhost:8080}
      APPLE_WALLET_ENABLED: ${APPLE_WALLET_ENABLED:-false}
      APPLE_WALLET_PASS_TYPE_IDENTIFIER: ${APPLE_WALLET_PASS_TYPE_IDENTIFIER:-}
      APPLE_WALLET_TEAM_IDENTIFIER: ${APPLE_WALLET_TEAM_IDENTIFIER:-}
      APPLE_WALLET_CERTIFICATE_P12: ${APPLE_WALLET_CERTIFICATE_P12:-}
      APPLE_WALLET_CERTIFICATE_PASSWORD: ${APPLE_WALLET_CERTIFICATE_PASSWORD:-}
      APPLE_WALLET_WWDR_CERTIFICATE: ${APPLE_WALLET_WWDR_CERTIFICATE:-}
      APPLE_WALLET_WEB_SERVICE_URL: ${APPLE_WALLET_WEB_SERVICE_URL:-http://localhost:8080/api/wallet/apple/v1}
      APPLE_WALLET_APNS_ENABLED: ${APPLE_WALLET_APNS_ENABLED:-false}
      APPLE_WALLET_APNS_PRODUCTION: ${APPLE_WALLET_APNS_PRODUCTION:-false}
      AZUL_WALLET_ENABLED: ${AZUL_WALLET_ENABLED:-false}
      AZUL_WALLET_ENVIRONMENT: ${AZUL_WALLET_ENVIRONMENT:-TEST}
      AZUL_STORE: ${AZUL_STORE:-}
      AZUL_AUTH1: ${AZUL_AUTH1:-}
      AZUL_AUTH2: ${AZUL_AUTH2:-}
      AZUL_CHANNEL: ${AZUL_CHANNEL:-EC}
      AZUL_APPLE_INITIATIVE_CONTEXT: ${AZUL_APPLE_INITIATIVE_CONTEXT:-}
      AZUL_GOOGLE_MERCHANT_ID: ${AZUL_GOOGLE_MERCHANT_ID:-}
      AZUL_APPLE_DOMAIN_ASSOCIATION: ${AZUL_APPLE_DOMAIN_ASSOCIATION:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - eventix-app-data:/app/data
    init: true
    stop_grace_period: 35s
    depends_on:
      sqlserver-configure:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --show-error http://localhost:8080/actuator/health/readiness
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  eventix-sqlserver-data:
  eventix-app-data:
