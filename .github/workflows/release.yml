name: Publish stable release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

concurrency:
  group: eventix-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          VERSION="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('pom.xml').getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          version = root.find('m:version', ns)
          if version is None or not version.text:
              raise SystemExit('Project version not found in pom.xml')
          print(version.text.strip())
          PY
          )"

          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "Refusing to publish development version: $VERSION" >&2
            exit 1
          fi

          NOTES_FILE="docs/releases/v${VERSION}.md"
          if [[ ! -f "$NOTES_FILE" ]]; then
            echo "Release notes not found: $NOTES_FILE" >&2
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "push" ]]; then
            TARGET="${{ github.event.before }}"
          else
            TARGET="${{ github.sha }}"
          fi

          if ! git cat-file -e "${TARGET}^{commit}" 2>/dev/null; then
            echo "Release target is not a valid commit: $TARGET" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
          TARGET: ${{ steps.release.outputs.target }}
        shell: bash
        run: |
          git fetch --tags --force

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_TARGET="$(git rev-list -n 1 "$TAG")"
            if [[ "$TAG_TARGET" != "$TARGET" ]]; then
              echo "Tag $TAG already exists on $TAG_TARGET, expected $TARGET" >&2
              exit 1
            fi
            echo "$TAG already points to $TARGET; nothing to change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$TARGET" -m "Eventix $TAG"
          git push origin "$TAG"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TARGET: ${{ steps.release.outputs.target }}
          NOTES_FILE: ${{ steps.release.outputs.notes_file }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; publication is idempotent."
            exit 0
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --title "Eventix $TAG" \
            --notes-file "$NOTES_FILE" \
            --latest
