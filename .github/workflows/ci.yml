name: Eventix CI

on:
  push:
    branches:
      - main
      - "agent/**"
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Show Docker diagnostics after failure
        if: failure()
        run: |
          docker version
          docker info
