name: Eventix CI

on:
  push:
    branches:
      - main
      - "agent/**"
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  verify:
    name: Build, test and secure
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EVENTIX_IMAGE_TAG: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Generate ephemeral Docker credentials
        run: |
          echo "MSSQL_SA_PASSWORD=Sa$(openssl rand -hex 16)!" >> "$GITHUB_ENV"
          echo "EVENTIX_DB_PASSWORD=Ev$(openssl rand -hex 16)!" >> "$GITHUB_ENV"
          echo "EVENTIX_MIGRATOR_PASSWORD=Mg$(openssl rand -hex 16)!" >> "$GITHUB_ENV"
          echo "EVENTIX_ELIGIBILITY_HMAC_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "EVENTIX_ALLOW_DEFAULT_BOOTSTRAP_ADMIN=true" >> "$GITHUB_ENV"
          echo "TICKETING_ALLOW_EPHEMERAL_SIGNING_KEY=true" >> "$GITHUB_ENV"

      - name: Verify with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload application and test evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: eventix-verification-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/eventix.jar
            target/site/jacoco/**
            target/surefire-reports/**
            target/checkstyle-*.xml

      - name: Prepare isolated browser administrator after Maven verification
        run: |
          INITIAL_BROWSER_PASSWORD="Bs$(openssl rand -hex 16)!As1"
          NEXT_BROWSER_PASSWORD="Bt$(openssl rand -hex 16)!At1"
          BUYER_BROWSER_PASSWORD="By$(openssl rand -hex 16)!Aa1"
          BUYER_BROWSER_NEXT_PASSWORD="Bn$(openssl rand -hex 16)!Aa1"
          ORGANIZER_BROWSER_PASSWORD="Or$(openssl rand -hex 16)!Aa1"
          ORGANIZER_BROWSER_NEXT_PASSWORD="On$(openssl rand -hex 16)!Aa1"
          for value in "$INITIAL_BROWSER_PASSWORD" "$NEXT_BROWSER_PASSWORD" "$BUYER_BROWSER_PASSWORD" "$BUYER_BROWSER_NEXT_PASSWORD" "$ORGANIZER_BROWSER_PASSWORD" "$ORGANIZER_BROWSER_NEXT_PASSWORD"; do
            echo "::add-mask::$value"
          done
          echo "EVENTIX_ALLOW_DEFAULT_BOOTSTRAP_ADMIN=false" >> "$GITHUB_ENV"
          echo "EVENTIX_BOOTSTRAP_ADMIN_PASSWORD=$INITIAL_BROWSER_PASSWORD" >> "$GITHUB_ENV"
          echo "EVENTIX_BROWSER_NEXT_PASSWORD=$NEXT_BROWSER_PASSWORD" >> "$GITHUB_ENV"
          echo "EVENTIX_BROWSER_BUYER_PASSWORD=$BUYER_BROWSER_PASSWORD" >> "$GITHUB_ENV"
          echo "EVENTIX_BROWSER_BUYER_NEXT_PASSWORD=$BUYER_BROWSER_NEXT_PASSWORD" >> "$GITHUB_ENV"
          echo "EVENTIX_BROWSER_ORGANIZER_PASSWORD=$ORGANIZER_BROWSER_PASSWORD" >> "$GITHUB_ENV"
          echo "EVENTIX_BROWSER_ORGANIZER_NEXT_PASSWORD=$ORGANIZER_BROWSER_NEXT_PASSWORD" >> "$GITHUB_ENV"

      - name: Start Eventix with Docker Compose
        id: start_eventix
        run: docker compose up --detach --build --wait --wait-timeout 300

      - name: Verify readiness, login and security headers
        run: |
          curl --fail --silent --show-error http://localhost:8080/actuator/health/readiness
          curl --fail --silent --show-error --dump-header /tmp/eventix-headers.txt http://localhost:8080/login --output /tmp/eventix-login.html
          grep --ignore-case "content-security-policy:" /tmp/eventix-headers.txt
          grep --ignore-case "x-content-type-options: nosniff" /tmp/eventix-headers.txt
          grep --ignore-case "x-frame-options: deny" /tmp/eventix-headers.txt
          grep --ignore-case "referrer-policy: no-referrer" /tmp/eventix-headers.txt
          grep --ignore-case "permissions-policy:" /tmp/eventix-headers.txt
          grep --ignore-case "x-correlation-id:" /tmp/eventix-headers.txt
          grep --quiet "Eventix" /tmp/eventix-login.html

      - name: Verify persistent restart and credential rotation
        run: |
          export EVENTIX_DB_PASSWORD="Ev'$(openssl rand -hex 16)!"
          export EVENTIX_MIGRATOR_PASSWORD="Mg'$(openssl rand -hex 16)!"
          docker compose up --detach --force-recreate --wait --wait-timeout 300
          docker compose exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U eventix_app -P "$EVENTIX_DB_PASSWORD" \
            -C -b -d EventixDb -Q "SELECT 1"
          docker compose exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U eventix_migrator -P "$EVENTIX_MIGRATOR_PASSWORD" \
            -C -b -d EventixDb -Q "SELECT 1"
          curl --fail --silent --show-error http://localhost:8080/actuator/health/readiness

      - name: Install Chromium for browser smoke evidence
        timeout-minutes: 8
        run: |
          npm install --prefix ci/browser --ignore-scripts --no-audit --no-fund --package-lock=false
          ./ci/browser/node_modules/.bin/playwright install --with-deps chromium

      - name: Verify public pages and administrator UX in Chromium
        timeout-minutes: 8
        env:
          EVENTIX_BROWSER_BASE_URL: http://127.0.0.1:8080
          EVENTIX_BROWSER_OUTPUT: target/browser-evidence
        run: node ci/browser/smoke.mjs

      - name: Upload actual browser screenshots and viewport manifest
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: eventix-browser-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: target/browser-evidence/**

      - name: Show Docker diagnostics after failure
        if: ${{ failure() && steps.start_eventix.outcome != 'skipped' }}
        run: |
          docker version
          docker info
          docker compose ps
          docker compose logs --no-color

      - name: Stop Docker Compose
        if: ${{ always() && steps.start_eventix.outcome != 'skipped' }}
        run: docker compose down --volumes --remove-orphans

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: eventix:ci
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"
          # Excepciones justificadas y con caducidad; al expirar vuelven a bloquear.
          trivyignores: .trivyignore.yaml

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.23.1
        with:
          image: eventix:ci
          format: spdx-json
          output-file: eventix-sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v5
        with:
          name: eventix-sbom-${{ github.sha }}
          path: eventix-sbom.spdx.json
          retention-days: 30
