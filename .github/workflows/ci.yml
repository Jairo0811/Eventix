name: Eventix CI

on:
  push:
    branches:
      - main
      - "agent/**"
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Generate ephemeral Docker credentials
        run: |
          echo "MSSQL_SA_PASSWORD=Sa$(openssl rand -hex 16)!" >> "$GITHUB_ENV"
          echo "EVENTIX_DB_PASSWORD=Ev$(openssl rand -hex 16)!" >> "$GITHUB_ENV"

      - name: Verify with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Start Eventix with Docker Compose
        id: start_eventix
        run: docker compose up --detach --build --wait --wait-timeout 300

      - name: Verify Eventix login page
        run: curl --fail --silent --show-error http://localhost:8080/login

      - name: Show Docker diagnostics after failure
        if: ${{ failure() && steps.start_eventix.outcome != 'skipped' }}
        run: |
          docker version
          docker info
          docker compose ps
          docker compose logs --no-color

      - name: Stop Docker Compose
        if: ${{ always() && steps.start_eventix.outcome != 'skipped' }}
        run: docker compose down --volumes --remove-orphans
