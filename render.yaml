services:
  - type: web
    name: eventix
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_PORT
        value: 8080
      - key: APP_BASE_URL
        sync: false
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FLYWAY_DB_URL
        sync: false
      - key: FLYWAY_DB_USERNAME
        sync: false
      - key: FLYWAY_DB_PASSWORD
        sync: false
      - key: EVENTIX_ELIGIBILITY_HMAC_SECRET
        generateValue: true
      - key: EVENTIX_ALLOW_DEFAULT_BOOTSTRAP_ADMIN
        value: false
      - key: EVENTIX_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: TICKETING_ALLOW_EPHEMERAL_SIGNING_KEY
        value: true
      - key: EVENTIX_EMAIL_ENABLED
        value: false
      - key: AZUL_WALLET_ENABLED
        value: false
      - key: GOOGLE_WALLET_ENABLED
        value: false
      - key: APPLE_WALLET_ENABLED
        value: false
